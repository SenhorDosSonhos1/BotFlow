[project]
name = "botflow"
version = "0.1.0"
description = ""
authors = [
    {name = "SenhorDosSonhos1",email = "marcelosamu2002@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "taskify (>=0.0.1,<0.0.2)",
    "ruff (>=0.16.1,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.taskipy.tasks]
run = "fastapi dev app/main.py"
test = "pytest"
lint = "ruff check ."
format = "ruff format ."